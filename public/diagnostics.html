<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart Chaos · Tracking diagnostics</title><style>body{background:#132a3b;color:#fff4df;font:16px system-ui;max-width:800px;margin:10vh auto;padding:30px}h1{color:#ff9673}button,a{background:#ff9673;color:#132a3b;padding:14px 20px;border:0;border-radius:8px;font:700 15px system-ui;text-decoration:none;display:inline-block;margin:15px 10px 15px 0}pre{white-space:pre-wrap;background:#071e2c;padding:24px;border-radius:12px}p{line-height:1.6;color:#b7d1d3}</style><h1>Body tracking diagnostics</h1><p>This checks the local worker, WASM runtime, two-pose configuration and model inference on a blank image. It does not request camera access and does not verify real-person tracking accuracy.</p><button id="test">Test tracking engine</button><a href="/">Back to the game</a><pre id="status" role="status">Ready to test.</pre><script>
const button=document.querySelector('#test'),status=document.querySelector('#status');let worker;
button.onclick=()=>{button.disabled=true;worker?.terminate();status.textContent='Loading local model and WASM…';worker=new Worker('/vision-worker.js');const timeout=setTimeout(()=>{status.textContent='FAIL: engine timed out after 45 seconds.';worker.terminate();button.disabled=false},45000);worker.onmessage=async e=>{if(e.data.type==='ready'){status.textContent='Model ready. Running an inference…';const canvas=new OffscreenCanvas(640,480);const ctx=canvas.getContext('2d');ctx.fillStyle='#556677';ctx.fillRect(0,0,640,480);const bitmap=await createImageBitmap(canvas);worker.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);}if(e.data.type==='poses'){clearTimeout(timeout);status.textContent=`PASS: local model loaded; numPoses = 2; worker inference completed.\nDetected ${e.data.poses.length} people in a blank image (expected 0).\n\nReal two-player tracking still needs the manual camera test in README.md.`;worker.terminate();button.disabled=false;}if(e.data.type==='error')fail(e.data.message);};worker.onerror=e=>fail(e.message);function fail(message){clearTimeout(timeout);status.textContent='FAIL: '+message;worker.terminate();button.disabled=false;}worker.postMessage({type:'init'});};
</script></html>
